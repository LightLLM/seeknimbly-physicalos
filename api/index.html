<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysicalOS</title><style>
body{background:#07121d;color:#e9f7fa;font:16px system-ui;max-width:1000px;margin:32px auto;padding:18px}h1{color:#8de5cf;margin-bottom:4px}.muted{color:#9db1bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card,pre{background:#122235;border:1px solid #284157;padding:15px;border-radius:12px;white-space:pre-wrap}button,select{padding:10px 14px;margin:6px;border-radius:8px;border:0}button{background:#8de5cf;color:#07121d;font-weight:700}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#284157}.ok{color:#8de5cf}.warn{color:#ffcc66}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Seeknimbly / PhysicalOS</h1><p class="muted">Human-approved manufacturing dispatch · synthetic data · simulated robots only</p><p><span class="badge" id="stats">Loading…</span> <span class="badge" id="ai">Checking inference…</span></p><div class="grid"><section><h2>1 · Dispatch</h2><select id="order"></select><button onclick="rec()">Recommend</button><pre id="suggest">Select an order.</pre><button onclick="propose()">Request supervisor approval</button></section><section><h2>2 · Supervisor queue</h2><div id="queue" class="card">No proposals.</div></section></div><h2>3 · Audit trail</h2><pre id="audit">[]</pre><script>
let suggestion;async function api(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw Error(body.detail||JSON.stringify(body));return body}async function load(){const [state,health]=await Promise.all([api('/api/state'),api('/api/health')]);stats.textContent=`${state.workers.length} workers · ${state.orders.length} orders · ${state.robots.length} simulated robots`;ai.textContent=health.ai_configured?`Nebius ready · ${health.model}`:'Rules mode · Nebius credentials pending';ai.className='badge '+(health.ai_configured?'ok':'warn');order.innerHTML=state.orders.map(item=>`<option value="${item.id}">${item.id} · ${item.task}</option>`).join('');await refresh()}async function rec(){try{suggestion=await api('/api/recommend/'+order.value);suggest.textContent=JSON.stringify(suggestion,null,2)}catch(error){alert(error.message)}}async function propose(){if(!suggestion)return alert('Recommend first');try{await api('/api/proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(suggestion)});await refresh()}catch(error){alert(error.message)}}async function decision(id,approve){try{await api(`/api/proposals/${id}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approve})});await refresh()}catch(error){alert(error.message)}}async function refresh(){const proposals=await api('/api/proposals');queue.innerHTML=proposals.length?proposals.map(item=>`<div>#${item.id} ${item.order_id} / Worker ${item.worker_id} / <b>${item.status}</b>${item.status==='pending'?`<button onclick="decision(${item.id},true)">Approve</button><button onclick="decision(${item.id},false)">Reject</button>`:''}</div>`).join(''):'No proposals.';audit.textContent=JSON.stringify(await api('/api/audit'),null,2)}load()
</script></body></html>
